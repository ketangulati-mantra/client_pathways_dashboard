server {
    listen 80;
    server_name _;

    location /provider_activity {
        proxy_pass http://127.0.0.1:80/provider_activity;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /provider_pathway {
        proxy_pass http://127.0.0.1:80/provider_pathway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /provider_pathways {
        proxy_pass http://127.0.0.1:80/provider_pathways;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Redirect root to subpath
    location = / {
        return 301 /provider_activity/;
    }
}

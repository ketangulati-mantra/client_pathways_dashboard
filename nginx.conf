server {
    listen 80;
    server_name localhost;

    location /client-tasks/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /client-tasks/index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

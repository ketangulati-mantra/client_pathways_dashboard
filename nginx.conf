server {
    listen 80;
    server_name _;

    location /client_tasks {
        proxy_pass http://127.0.0.1:80/client_tasks;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /client-tasks {
        proxy_pass http://127.0.0.1:80/client-tasks;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Redirect root to subpath
    location = / {
        return 301 /client_tasks/;
    }
}

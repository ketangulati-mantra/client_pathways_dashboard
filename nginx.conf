server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle assets and SPA routes under /client_tasks
    location ^~ /client_tasks {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Handle root requests
    location / {
        try_files $uri $uri/ /index.html;
    }
}
